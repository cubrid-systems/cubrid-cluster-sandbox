<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="cluster-sandbox — multi-node CUBRID topologies for development: one command, your own build, and the states you need one for as verbs: lag, split brain, the trip back">
<style>
  .name{font-size:36px;font-weight:700;fill:#f8fafc;letter-spacing:-0.5px}
  .tag{font-size:13.5px;fill:#94a3b8}
  .meta{font-size:11px;fill:#64748b;letter-spacing:1.2px}
  .nn{font-size:11.5px;font-weight:700;fill:#e2e8f0}
  .role{font-size:10px;font-weight:700}
  .lbl{font-size:9.5px;fill:#94a3b8}
  .find{font-size:10px;fill:#f87171}
  .node{fill:#1e293b;stroke:#334155;stroke-width:1.2}
  .wire{stroke:#475569;stroke-width:1.6;fill:none}
  .ping{stroke:#475569;stroke-width:1;fill:none;stroke-dasharray:3 3}
  .cut{stroke:#f87171;stroke-width:2.2;stroke-linecap:round}
</style>

<rect x="0" y="0" width="880" height="200" fill="#0f172a"/>
<rect x="0" y="0" width="6" height="200" fill="#2563eb"/>

<text class="name" x="40" y="76">cluster-sandbox</text>
<text class="tag"  x="41" y="104">Multi-node CUBRID topologies for development: one command, your own build.</text>
<text class="tag"  x="41" y="123">The states you need one for are verbs — lag, split brain, the trip back.</text>
<text class="meta" x="41" y="158">FOR ENGINE DEVELOPERS, QA, AND EXTERNAL CONTRIBUTORS</text>

<!-- motif: the measured split brain -->
<rect x="676" y="34" width="96" height="22" rx="4" fill="none" stroke="#475569" stroke-width="1"/>
<text class="lbl" x="724" y="49" text-anchor="middle">ping host</text>
<path class="ping" d="M 656 90 L 700 58"/>
<path class="ping" d="M 792 90 L 748 58"/>

<path class="wire" d="M 712 113 L 736 113"/>

<rect class="node" x="600" y="90" width="112" height="46" rx="6"/>
<text class="nn"   x="656" y="110" text-anchor="middle">hadb-n1</text>
<text class="role" x="656" y="126" text-anchor="middle" fill="#4ade80">active</text>

<rect class="node" x="736" y="90" width="112" height="46" rx="6"/>
<text class="nn"   x="792" y="110" text-anchor="middle">hadb-n2</text>
<text class="role" x="792" y="126" text-anchor="middle" fill="#60a5fa">standby</text>

<path class="cut" d="M 718 107 L 730 119 M 730 107 L 718 119"/>

<text class="find" x="724" y="160" text-anchor="middle">cut the peer, keep the ping host → two masters in 9 s</text>
</svg>
