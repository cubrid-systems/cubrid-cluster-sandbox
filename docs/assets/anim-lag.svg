<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Animated: suspending the apply stage freezes every column of db_ha_apply_info for 30 seconds, including eof_lsa, and the truth arrives in one sample on release. Suspending the copy stage makes the reported lag fall from 49544 to 38576 while replication is entirely stopped. Only a master-side reference sees either.">
<style>
  .ttl{font-size:15px;font-weight:700;fill:#1f2937}
  .sub{font-size:11px;fill:#6b7280}
  .h{font-size:11.5px;font-weight:700;fill:#1f2937}
  .nn{font-size:10.5px;font-weight:700;fill:#1f2937}
  .d{font-size:9.5px;fill:#6b7280}
  .dd{font-size:8.5px;fill:#9ca3af}
  .lab{font-size:9px;font-weight:700;fill:#9ca3af;letter-spacing:.5px}
  .m{font-size:9px;fill:#34495e;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .val{font-size:15px;font-weight:700;fill:#1f2937;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .box{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
  .arw{stroke:#9ca3af;stroke-width:1.4;fill:none;marker-end:url(#a)}
  .st{font-size:8px;fill:#6b7280;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="880" height="320" fill="#ffffff"/>

<text class="ttl" x="10" y="20">Two stages — and the gauge that cannot say which one stopped</text>
<text class="m" x="870" y="20" text-anchor="end" fill="#2563eb">csb repl status --json<animate attributeName="opacity" values="1;0;1;0;0" keyTimes="0;0.22;0.52;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="m" x="870" y="20" text-anchor="end" fill="#9a6700" opacity="0">csb fault lag slave --stage apply<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.22;0.52;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="m" x="870" y="20" text-anchor="end" fill="#c0392b" opacity="0">csb fault lag slave --stage copy<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="sub" x="10" y="36">The heartbeat watches process existence, not progress: both stages were held for 30 s and cubrid heartbeat status never changed. Measured 2026-08-27.</text>

<!-- lanes drawn first so the boxes paint over them -->
<line class="arw" x1="164" y1="87" x2="226" y2="87"/>
<line class="arw" x1="344" y1="87" x2="396" y2="87"/>
<line class="arw" x1="514" y1="87" x2="566" y2="87"/>
<line class="arw" x1="684" y1="87" x2="716" y2="87"/>
<g>
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.60;0.601;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <circle cy="87" r="3.5" fill="#1a7f37"><animate attributeName="cx" values="168;222" dur="1.4s" repeatCount="indefinite"/></circle>
  <circle cy="87" r="3.5" fill="#1a7f37"><animate attributeName="cx" values="348;392" dur="1.4s" begin="0.4s" repeatCount="indefinite"/></circle>
</g>
<g>
  <animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.22;0.52;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <circle cy="87" r="3.5" fill="#1a7f37"><animate attributeName="cx" values="518;562" dur="1.4s" begin="0.2s" repeatCount="indefinite"/></circle>
  <circle cy="87" r="3.5" fill="#1a7f37"><animate attributeName="cx" values="688;712" dur="1.4s" begin="0.6s" repeatCount="indefinite"/></circle>
</g>

<rect class="box" x="10" y="58" width="150" height="58" rx="5"/>
<text class="nn" x="22" y="78">hadb-n1</text>
<text x="148" y="78" text-anchor="end" font-size="9.5" font-weight="700" fill="#1a7f37">active</text>
<text class="dd" x="22" y="94">active log — writes never stop</text>
<text class="dd" x="22" y="108">3,440,000 rows written</text>

<rect x="230" y="72" width="110" height="30" rx="4" fill="#f0fdf4" stroke="#1a7f37">
  <animate attributeName="fill" values="#f0fdf4;#fffbeb" keyTimes="0;0.60" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <animate attributeName="stroke" values="#1a7f37;#9a6700" keyTimes="0;0.60" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
</rect>
<text class="d" x="285" y="86" text-anchor="middle" fill="#1f2937">copylogdb</text>
<text class="st" x="285" y="97" text-anchor="middle">running<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="st" x="285" y="97" text-anchor="middle" fill="#9a6700" opacity="0">SIGSTOP<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

<rect class="box" x="400" y="58" width="110" height="58" rx="5"/>
<text class="dd" x="455" y="72" text-anchor="middle">copied log, on disk</text>
<rect x="408" y="76" width="94" height="32" rx="2" fill="#f3f4f6"/>
<rect x="408" y="98" width="94" height="10" fill="#9a6700">
  <animate attributeName="height" values="10;10;30;30;8;8;22;22" keyTimes="0;0.22;0.50;0.52;0.58;0.60;0.85;1" dur="12s" repeatCount="indefinite"/>
  <animate attributeName="y"      values="98;98;78;78;100;100;86;86" keyTimes="0;0.22;0.50;0.52;0.58;0.60;0.85;1" dur="12s" repeatCount="indefinite"/>
</rect>

<rect x="570" y="72" width="110" height="30" rx="4" fill="#f0fdf4" stroke="#1a7f37">
  <animate attributeName="fill" values="#f0fdf4;#fffbeb;#f0fdf4" keyTimes="0;0.22;0.52" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <animate attributeName="stroke" values="#1a7f37;#9a6700;#1a7f37" keyTimes="0;0.22;0.52" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
</rect>
<text class="d" x="625" y="86" text-anchor="middle" fill="#1f2937">applylogdb</text>
<text class="st" x="625" y="97" text-anchor="middle">running<animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.22;0.52;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="st" x="625" y="97" text-anchor="middle" fill="#9a6700" opacity="0">SIGSTOP<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.22;0.52;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

<rect class="box" x="720" y="58" width="150" height="58" rx="5"/>
<text class="nn" x="732" y="78">hadb-n2</text>
<text x="858" y="78" text-anchor="end" font-size="9.5" font-weight="700" fill="#2563eb">standby</text>
<text class="dd" x="732" y="94">1,680,000 rows applied</text>
<text class="dd" x="732" y="108">one applier never kept up</text>

<text class="dd" x="440" y="132" text-anchor="middle">two heartbeat-managed processes — HB_PTYPE_COPYLOGDB and HB_PTYPE_APPLYLOGDB, and the engine reports their delays separately</text>

<!-- gauge A -->
<rect class="box" x="10" y="142" width="420" height="124" rx="5"/>
<text class="h" x="24" y="162">db_ha_apply_info</text>
<text class="dd" x="24" y="176">the slave&#39;s catalog view — and applylogdb is what writes the row</text>
<text class="lab" x="24" y="200">EOF_LSA</text>
<text class="val" x="418" y="202" text-anchor="end">40,419<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.52;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="fill" values="#1f2937;#9a6700;#1f2937" keyTimes="0;0.22;0.52" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="val" x="418" y="202" text-anchor="end" opacity="0">71,143<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.52;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="val" x="418" y="202" text-anchor="end" fill="#9a6700" opacity="0">80,459<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="lab" x="24" y="220">FINAL_LSA</text>
<text class="val" x="418" y="222" text-anchor="end">12,633<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.52;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="fill" values="#1f2937;#9a6700;#1f2937" keyTimes="0;0.22;0.52" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="val" x="418" y="222" text-anchor="end" opacity="0">16,288<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.52;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="val" x="418" y="222" text-anchor="end" opacity="0">41,883<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="lab" x="24" y="240">LAG  (EOF − FINAL)</text>
<text class="val" x="418" y="242" text-anchor="end">27,786<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.52;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="fill" values="#1f2937;#9a6700;#1f2937" keyTimes="0;0.22;0.52" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="val" x="418" y="242" text-anchor="end" opacity="0">54,855<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.52;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="val" x="418" y="242" text-anchor="end" fill="#c0392b" opacity="0">38,576 ↓<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="dd" x="24" y="258">row written 0.4 s ago<animate attributeName="opacity" values="1;0;1;0;0" keyTimes="0;0.22;0.52;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="dd" x="24" y="258" fill="#9a6700" opacity="0">row written 30 s ago · stale_apply_info — every column frozen, eof_lsa included<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.22;0.52;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="dd" x="24" y="258" fill="#c0392b" opacity="0">eof_lsa is frozen, the applier keeps draining — so the reported lag falls<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

<!-- gauge B -->
<rect class="box" x="450" y="142" width="420" height="124" rx="5"/>
<text class="h" x="464" y="162">applyinfo -r hadb-n1</text>
<text class="dd" x="464" y="176">the master-side reference — the two stages, read separately</text>
<text class="lab" x="464" y="198">COPY DELAY (PAGES)</text>
<text class="val" x="856" y="200" text-anchor="end">620<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="val" x="856" y="200" text-anchor="end" fill="#c0392b" opacity="0">48,343<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<rect x="464" y="206" width="392" height="6" rx="3" fill="#f3f4f6"/>
<rect x="464" y="206" width="6" height="6" rx="3" fill="#2563eb"><animate attributeName="width" values="6;6;300;300" keyTimes="0;0.60;0.75;1" dur="12s" repeatCount="indefinite"/></rect>
<text class="lab" x="464" y="226">APPLY DELAY (PAGES)</text>
<text class="val" x="856" y="228" text-anchor="end">27,786<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.22;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="val" x="856" y="228" text-anchor="end" opacity="0">54,855<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.22;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="val" x="856" y="228" text-anchor="end" opacity="0">38,576<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<rect x="464" y="234" width="392" height="6" rx="3" fill="#f3f4f6"/>
<rect x="464" y="234" width="180" height="6" rx="3" fill="#2563eb"><animate attributeName="width" values="180;180;340;340;240;240" keyTimes="0;0.22;0.32;0.60;0.64;1" dur="12s" repeatCount="indefinite"/></rect>
<text class="dd" x="464" y="258">both stages against the master&#39;s own append position<animate attributeName="opacity" values="1;0;0;1;0;0" keyTimes="0;0.22;0.52;0.521;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="dd" x="464" y="258" fill="#9a6700" opacity="0">copying never stopped — the growth the view cannot show is here<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.22;0.52;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="dd" x="464" y="258" fill="#c0392b" opacity="0">48,343 pages behind, while the view says 38,576 and improving<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

<rect x="10" y="274" width="860" height="26" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
<text class="m" xml:space="preserve" x="22" y="291">cubrid heartbeat status  →  copylogdb:260  applylogdb:263  state registered</text>
<text class="d" x="858" y="291" text-anchor="end">unchanged across the whole run — a live but frozen process is invisible to it</text>

<text class="dd" x="10" y="314">So there is no field called delay: repl status reports copy and apply separately, or reports null with a reason. Never zero.  docs/findings/replication-lag.md · docs/design/05-inspect.md §3</text>
</svg>
