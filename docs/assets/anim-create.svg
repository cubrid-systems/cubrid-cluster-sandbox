<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 332" width="880" height="332" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Animated: what csb cluster create decides. A top lane shows what the tool does and a bottom lane what the engine is doing meanwhile, while a callout names each point where a script doing the obvious thing would break — seeding on the databases.txt entry before createdb has returned, copying the database directory instead of hadb star without the lock file, starting the heartbeat one node at a time, and reporting the cluster ready before the master is writable.">
<style>
  .ttl{font-size:15px;font-weight:700;fill:#1f2937}
  .sub{font-size:11px;fill:#6b7280}
  .dd{font-size:8.5px;fill:#9ca3af}
  .lane{font-size:11px;font-weight:700;letter-spacing:.6px}
  .say{font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ch{font-size:11.5px;font-weight:700;fill:#9a6700}
  .ck{font-size:10px;fill:#9a6700;font-weight:700;letter-spacing:.3px}
  .cv{font-size:10px;fill:#6b7280;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .nt{font-size:11.5px;fill:#6b7280}
  .stoplbl{font-size:10px;fill:#9ca3af;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .track{stroke:#e5e7eb;stroke-width:2.5;fill:none}
  .prog{stroke:#2563eb;stroke-width:2.5;fill:none;stroke-linecap:round}
</style>
<rect x="0" y="0" width="880" height="332" fill="#ffffff"/>

<text class="ttl" x="10" y="20">What csb cluster create decides</text>
<text class="sub" x="10" y="36">The top lane is the tool. The bottom lane is what the engine is doing meanwhile. The callout is where a script that did the obvious thing would break.</text>
<text class="dd" x="360" y="58" text-anchor="middle">most of these 50 s are createdb, and the tool is waiting on it</text>

<line class="track" x1="60" y1="72" x2="820" y2="72"/>
<line class="prog" x1="60" y1="72" x2="60" y2="72">
  <animate attributeName="x2" values="60;200;200;520;640;820;820" keyTimes="0;0.06;0.08;0.60;0.62;0.94;1" dur="12s" repeatCount="indefinite"/>
</line>
<circle cx="60"  cy="72" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<circle cx="200" cy="72" r="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"><animate attributeName="fill" values="#ffffff;#2563eb" keyTimes="0;0.06" dur="12s" calcMode="discrete" repeatCount="indefinite"/></circle>
<circle cx="520" cy="72" r="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"><animate attributeName="fill" values="#ffffff;#2563eb" keyTimes="0;0.60" dur="12s" calcMode="discrete" repeatCount="indefinite"/></circle>
<circle cx="640" cy="72" r="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"><animate attributeName="fill" values="#ffffff;#2563eb" keyTimes="0;0.62" dur="12s" calcMode="discrete" repeatCount="indefinite"/></circle>
<circle cx="820" cy="72" r="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"><animate attributeName="fill" values="#ffffff;#1a7f37" keyTimes="0;0.94" dur="12s" calcMode="discrete" repeatCount="indefinite"/></circle>
<text class="stoplbl" x="60"  y="90" text-anchor="middle" fill="#1f2937">absent</text>
<text class="stoplbl" x="200" y="90" text-anchor="middle">defined<animate attributeName="fill" values="#9ca3af;#1f2937" keyTimes="0;0.06" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="stoplbl" x="520" y="90" text-anchor="middle">seeded<animate attributeName="fill" values="#9ca3af;#1f2937" keyTimes="0;0.60" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="stoplbl" x="640" y="90" text-anchor="middle">forming<animate attributeName="fill" values="#9ca3af;#1f2937" keyTimes="0;0.62" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="stoplbl" x="820" y="90" text-anchor="middle">serving<animate attributeName="fill" values="#9ca3af;#1a7f37" keyTimes="0;0.94" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

<line x1="60" y1="64" x2="60" y2="200" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3" opacity="0.55">
  <animate attributeName="x1" values="60;200;200;520;640;820;820" keyTimes="0;0.06;0.08;0.60;0.62;0.94;1" dur="12s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="60;200;200;520;640;820;820" keyTimes="0;0.06;0.08;0.60;0.62;0.94;1" dur="12s" repeatCount="indefinite"/>
</line>

<!-- lane A: the tool -->
<rect x="30" y="106" width="820" height="42" rx="5" fill="#eff6ff" stroke="#2563eb"/>
<text class="lane" x="46" y="132" fill="#2563eb">CSB</text>
<text class="say" x="112" y="132" fill="#1f2937">resolving the topology; writing cubrid.conf and cubrid_ha.conf on both nodes<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.06;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="132" fill="#1f2937" opacity="0">createdb hadb on hadb-n1<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.06;0.30;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="132" fill="#9a6700" opacity="0">waiting for the completion sentinel — not for databases.txt<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.30;0.46;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="132" fill="#9a6700" opacity="0">copying hadb* to hadb-n2, excluding *__lock<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.46;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="132" fill="#9a6700" opacity="0">cubrid heartbeat start on 2 node(s), concurrently<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.60;0.74;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="132" fill="#9a6700" opacity="0">polling changemode until hadb-n1 reaches registered_and_active<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.74;0.94;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="132" fill="#1a7f37" opacity="0">cluster hadb: 2 node(s) on hadb-net, state serving<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.94;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

<!-- lane B: the engine -->
<rect x="30" y="154" width="820" height="42" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
<text class="lane" x="46" y="180" fill="#9ca3af">ENGINE</text>
<text class="say" x="112" y="180" fill="#6b7280">nothing running<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.06;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="180" fill="#6b7280" opacity="0">createdb: formatting volumes<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.06;0.22;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="180" fill="#c0392b" opacity="0">databases.txt has the entry — and createdb has not returned<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.22;0.30;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="180" fill="#6b7280" opacity="0">createdb returns; the transaction it held is committed<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.30;0.46;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="180" fill="#6b7280" opacity="0">hadb_lgat__lock is held on hadb-n1, and vanishes mid-copy<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.46;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="180" fill="#6b7280" opacity="0">heartbeat forming: neither call returns until both have run<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.60;0.74;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="180" fill="#c0392b" opacity="0">hadb-n1 registered_and_to_be_active — writes are rejected here<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.74;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="say" x="112" y="180" fill="#1a7f37" opacity="0">hadb-n1 registered_and_active · hadb-n2 registered_and_standby<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

<!-- the callout -->
<rect x="30" y="212" width="820" height="94" rx="5" fill="#f9fafb" stroke="#d1d5db">
  <animate attributeName="fill" values="#f9fafb;#fffbeb;#f9fafb" keyTimes="0;0.24;0.94" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <animate attributeName="stroke" values="#d1d5db;#9a6700;#d1d5db" keyTimes="0;0.24;0.94" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
</rect>
<rect x="30" y="212" width="4" height="94" fill="#d1d5db">
  <animate attributeName="fill" values="#d1d5db;#9a6700;#d1d5db" keyTimes="0;0.24;0.94" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
</rect>

<g opacity="1">
  <animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.24;0.94;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <text class="nt" x="48" y="252">Every transition is bounded, and every one decides on <tspan font-weight="700" fill="#1f2937">observed state</tspan> —<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.94;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="nt" x="48" y="274">not on the exit code of the command that was supposed to cause it.<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.94;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="nt" x="48" y="252" opacity="0">Five of the seven traps produce a <tspan font-weight="700" fill="#1f2937">failed start</tspan>: loud, and an hour to find.<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.94;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="nt" x="48" y="274" opacity="0">T6 produces a <tspan font-weight="700" fill="#c0392b">corrupt slave</tspan>, which is quiet — and is why the tool waits.<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.94;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
</g>

<g opacity="0">
  <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.24;0.94;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <text class="ch" x="48" y="234">T6 — databases.txt is not a completion signal<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.46;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="ch" x="48" y="234" opacity="0">T3 — the volumes are files, and one of them disappears mid-copy<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.46;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="ch" x="48" y="234" opacity="0">T4 — cubrid heartbeat start blocks until the group forms<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.60;0.74;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="ch" x="48" y="234" opacity="0">T5 — the master is not writable the moment it is up<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.74;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

  <text class="ck" x="48" y="258">the obvious thing</text>
  <text class="ck" x="48" y="278">what it costs</text>
  <text class="ck" x="48" y="298">what csb does</text>

  <text class="cv" x="170" y="258">seed the slave as soon as databases.txt has the entry<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.46;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="cv" x="170" y="278" fill="#c0392b">a slave whose recovery dies in UNDO: fetching deallocated pageid 705 → LOG FATAL ERROR<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.46;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="cv" x="170" y="298">waits for a sentinel written after createdb returns — the one trap that corrupts rather than fails<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.46;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

  <text class="cv" x="170" y="258" opacity="0">cp -r /db/hadb across to the other node<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.46;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="cv" x="170" y="278" fill="#c0392b" opacity="0">the log is left behind — the volumes are files beside it — and __lock breaks the copy chain<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.46;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="cv" x="170" y="298" opacity="0">copies hadb* and excludes *__lock<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.46;0.60;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

  <text class="cv" x="170" y="258" opacity="0">start it on the master, then on the slave<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.60;0.74;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="cv" x="170" y="278" fill="#c0392b" opacity="0">the first call never returns: it is waiting for a peer that is not starting<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.60;0.74;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="cv" x="170" y="298" opacity="0">starts it on both nodes concurrently, and joins<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.60;0.74;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

  <text class="cv" x="170" y="258" opacity="0">report the cluster ready once cub_server is running<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.74;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="cv" x="170" y="278" fill="#c0392b" opacity="0">the first DDL of any scenario fails: Attempted to update the database when updates are disabled<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.74;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text class="cv" x="170" y="298" opacity="0">waits for registered_and_active before it reports serving<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.74;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
</g>

<text class="dd" x="10" y="324">Seven traps, five of them paid for by hand during the CBRD-26983 verification and N54&#39;s WU-51b work.  docs/design/03-assembly.md §2</text>
</svg>
