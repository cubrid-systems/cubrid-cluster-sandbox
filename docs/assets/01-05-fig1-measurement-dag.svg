<rect x="10" y="330" width="860" height="76" fill="#f8fafc" stroke="#d1d5db" stroke-width="1" rx="4"/>
<text class="g" x="22" y="350">Pass condition that ties the plan to a measurement already taken</text>
<text class="gd" x="22" y="368">G4's check is a re-run of the CBRD-26983 scenario set through one verb each — clean stop, crash, partition, failback.</text>
<text class="gd" x="22" y="383">The id sequence measured by hand on 2026-08-18 must reproduce:</text>
<text x="330" y="383" font-size="11.5" font-weight="700" fill="#1a7f37">1, 2, 21, 22, 41, 42, 61</text>
<text class="gd" x="22" y="398">— monotonic, unique, three gaps each within cached_num. A baseline exists, so no new measurement is needed to start.</text>

<text class="sub" x="10" y="432">green = verified today · slate = this project's work, no external dependency · amber = another project's deliverable · red = blocked / do not build here</text>
<text class="sub" x="10" y="448">Source: 01-05-survey_cubrid-gap-and-measurement.md §2–§4</text>
